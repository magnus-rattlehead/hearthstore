syntax = "proto2";

package hearthstore.exportformat;

option go_package = "github.com/magnus-rattlehead/hearthstore/internal/exportformat;exportformat";

// The entity messages retain the wire numbers of App Engine's datastore_v3.proto.
message PropertyValue {
  optional int64 int64_value = 1;
  optional bool boolean_value = 2;
  optional string string_value = 3;
  optional double double_value = 4;

  optional group PointValue = 5 {
    required double x = 6;
    required double y = 7;
  }

  optional group UserValue = 8 {
    required string email = 9;
    required string auth_domain = 10;
    optional string nickname = 11;
    optional string federated_identity = 21;
    optional string federated_provider = 22;
  }

  optional group ReferenceValue = 12 {
    required string app = 13;
    optional string name_space = 20;
    repeated group PathElement = 14 {
      required string type = 15;
      optional int64 id = 16;
      optional string name = 17;
    }
  }
}

message Property {
  enum Meaning {
    NO_MEANING = 0;
    ATOM_CATEGORY = 1;
    ATOM_LINK = 2;
    ATOM_TITLE = 3;
    ATOM_CONTENT = 4;
    ATOM_SUMMARY = 5;
    ATOM_AUTHOR = 6;
    GD_WHEN = 7;
    GD_EMAIL = 8;
    GEORSS_POINT = 9;
    GD_IM = 10;
    GD_PHONENUMBER = 11;
    GD_POSTALADDRESS = 12;
    GD_RATING = 13;
    BLOB = 14;
    TEXT = 15;
    BYTESTRING = 16;
    BLOBKEY = 17;
    INDEX_VALUE = 18;
    ENTITY_PROTO = 19;
    EMPTY_LIST = 24;
    LEGACY_FORMAT_VECTOR = 31;
    LEGACY_FORMAT_DECIMAL128 = 32;
    LEGACY_FORMAT_BYTES_WITH_SUBTYPE = 33;
    LEGACY_FORMAT_OBJECT_ID = 34;
    LEGACY_FORMAT_REGEX = 35;
    LEGACY_FORMAT_INT32 = 36;
    LEGACY_FORMAT_REQUEST_TIMESTAMP = 37;
    LEGACY_FORMAT_MIN_VALUE = 38;
    LEGACY_FORMAT_MAX_VALUE = 39;
    LEGACY_FORMAT_NESTED_ARRAY = 40;
  }

  optional Meaning meaning = 1 [default = NO_MEANING];
  optional string meaning_uri = 2;
  required string name = 3;
  required bool multiple = 4;
  required PropertyValue value = 5;
  optional bool searchable = 6 [default = false];
  optional string locale = 9 [default = "en"];
}

message Path {
  repeated group Element = 1 {
    required string type = 2;
    optional int64 id = 3;
    optional string name = 4;
  }
}

message Reference {
  required string app = 13;
  required Path path = 14;
  optional string name_space = 20;
}

message EntityProto {
  required Reference key = 13;
  repeated Property property = 14;
  repeated Property raw_property = 15;
  required Path entity_group = 16;
  optional int32 rank = 18;
}

enum KindType {
  KIND_TYPE_UNSPECIFIED = 0;
  ONE_KIND = 1;
  ALL_KINDS = 2;
}

enum NamespaceType {
  NAMESPACE_TYPE_UNSPECIFIED = 0;
  DEFAULT_NAMESPACE = 1;
  ONE_NAMESPACE = 2;
  ALL_NAMESPACES = 3;
}

message EntitySetSpec {
  optional KindType kind_type = 1;
  optional string kind = 2;
  optional NamespaceType namespace_type = 3;
  optional string namespace = 4;
}

message SingleExportMetadataPointer {
  optional EntitySetSpec entity_set_spec = 1;
  optional string export_metadata_file = 2;
  optional int64 num_entities = 3;
  optional int64 num_bytes = 4;
}

message OverallExportMetadata {
  repeated SingleExportMetadataPointer entity_set = 1;
}

message BackupInfo {
  optional string backup_name = 1;
  optional int64 start_timestamp = 2;
  optional int64 end_timestamp = 3;
}

message KindBackupInfo {
  optional string kind = 1;
  repeated string file = 2;
}

message Backup {
  optional BackupInfo backup_info = 1;
  repeated KindBackupInfo kind = 2;
}
