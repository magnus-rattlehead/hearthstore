<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>hearthstore dashboard</title>
    <style>
      .table-wrap {
        overflow-x: auto;
      }

      .table-wrap table {
        width: 100%;
      }

      .table-wrap th,
      .table-wrap td {
        padding: 0.5rem 1rem;
        text-align: center;
      }

      .rpc-panel {
        position: fixed;
        inset: 0 0 0 auto;
        z-index: 1;
        width: min(32rem, 100%);
        box-sizing: border-box;
        overflow: auto;
        padding: 1rem;
        background: Canvas;
        color: CanvasText;
        border-left: 1px solid;
      }
    </style>
  </head>

  <body>
    <main>
      <section aria-labelledby="indexes-heading">
        <details class="indexes-details">
          <summary id="indexes-heading">
            Datastore indexes (click to expand)
            <span id="indexes-count">(0)</span>
          </summary>
          <div class="table-wrap">
            <table class="indexes">
              <thead>
                <tr>
                  <th aria-sort="none">
                    <button
                      class="sort-button"
                      data-index-sort="project"
                      type="button"
                    >
                      project
                    </button>
                  </th>
                  <th aria-sort="none">
                    <button
                      class="sort-button"
                      data-index-sort="kind"
                      type="button"
                    >
                      kind
                    </button>
                  </th>
                  <th aria-sort="none">
                    <button
                      class="sort-button"
                      data-index-sort="properties"
                      type="button"
                    >
                      properties
                    </button>
                  </th>
                  <th aria-sort="none">
                    <button
                      class="sort-button"
                      data-index-sort="source"
                      type="button"
                    >
                      source
                    </button>
                  </th>
                  <th aria-sort="none">
                    <button
                      class="sort-button"
                      data-index-sort="state"
                      type="button"
                    >
                      state
                    </button>
                  </th>
                  <th aria-sort="none">
                    <button
                      class="sort-button"
                      data-index-sort="progress"
                      type="button"
                    >
                      progress
                    </button>
                  </th>
                  <th aria-sort="none">
                    <button
                      class="sort-button"
                      data-index-sort="error"
                      type="button"
                    >
                      error
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody id="indexes-body">
                <tr>
                  <td colspan="7" class="muted">none</td>
                </tr>
              </tbody>
            </table>
          </div>
        </details>
      </section>

      <section aria-labelledby="operations-heading">
        <h2 id="operations-heading">Operations</h2>
        <form class="filter-form" id="ops-filters">
          <label
            >method
            <select id="f-method">
              <option value="">all</option>
            </select>
          </label>
          <label
            >status
            <select id="f-status">
              <option value="">all</option>
              <option value="2">2xx</option>
              <option value="3">3xx</option>
              <option value="4">4xx</option>
              <option value="5">5xx</option>
            </select>
          </label>
          <label
            >error
            <select id="f-error">
              <option value="">all</option>
              <option value="true">errors</option>
            </select>
          </label>
          <label>search <input id="f-q" autocomplete="off" /></label>
          <label>path <input id="f-path" autocomplete="off" /></label>
          <label
            >min ms <input id="f-min-latency" type="number" min="0"
          /></label>
          <label
            >limit
            <select id="f-limit">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100" selected>100</option>
              <option value="250">250</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
          </label>
          <div class="filter-actions">
            <button id="ops-apply" type="submit">apply</button>
            <button id="ops-clear" type="reset">clear</button>
          </div>
        </form>
        <p class="operations-count" id="ops-count" aria-live="polite">
          loading...
        </p>
        <div class="table-wrap">
          <table class="recent">
            <thead>
              <tr>
                <th>time</th>
                <th>method</th>
                <th>path</th>
                <th class="number">latency</th>
                <th class="number">status</th>
              </tr>
            </thead>
            <tbody id="operations-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <aside
      class="rpc-panel"
      id="rpc-panel"
      aria-labelledby="rpc-panel-title"
      aria-hidden="true"
      hidden
    >
      <button
        class="rpc-panel-close"
        id="rpc-panel-close"
        aria-label="Close RPC detail"
      >
        x
      </button>
      <h3 id="rpc-panel-title">RPC detail</h3>
      <div id="rpc-panel-body"></div>
    </aside>

    <script>
      let operationEntries = [];
      let selectedIdx = -1;
      let selectedOperationID = null;
      let copySlots = {};
      let indexEntries = [];
      let indexSortKey = null;
      let indexSortDirection = "asc";
      const operationMethods = new Set();
      const indexCollator = new Intl.Collator(undefined, {
        numeric: true,
        sensitivity: "base",
      });

      function esc(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmt(value, decimals = 0) {
        if (value == null) return "-";
        if (value >= 1e9) return (value / 1e9).toFixed(1) + "B";
        if (value >= 1e6) return (value / 1e6).toFixed(1) + "M";
        if (value >= 1e3) return (value / 1e3).toFixed(1) + "k";
        return Number(value).toFixed(decimals);
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function indexProperties(index) {
        return (index.properties || [])
          .map((property) => property.name + (property.desc ? " desc" : ""))
          .join(", ");
      }

      function indexValue(index, key) {
        if (key === "properties") return indexProperties(index);
        if (key === "progress") {
          return index.total_entities > 0
            ? index.processed_entities / index.total_entities
            : null;
        }
        return index[key] || null;
      }

      function renderIndexes(indexes = indexEntries) {
        indexEntries = indexes;
        const sorted = indexes.map((index, position) => ({ index, position }));
        if (indexSortKey) {
          sorted.sort((left, right) => {
            const leftValue = indexValue(left.index, indexSortKey);
            const rightValue = indexValue(right.index, indexSortKey);
            if (leftValue == null || rightValue == null) {
              if (leftValue == null && rightValue == null)
                return left.position - right.position;
              return leftValue == null ? 1 : -1;
            }
            const comparison =
              typeof leftValue === "number"
                ? leftValue - rightValue
                : indexCollator.compare(String(leftValue), String(rightValue));
            return comparison === 0
              ? left.position - right.position
              : comparison * (indexSortDirection === "asc" ? 1 : -1);
          });
        }

        setText("indexes-count", `(${indexes.length})`);
        document.getElementById("indexes-body").innerHTML = sorted.length
          ? sorted
              .map(({ index }) => {
                const progress = index.total_entities
                  ? `${fmt(index.processed_entities)} / ${fmt(index.total_entities)}`
                  : "-";
                return `<tr><td>${esc(index.project)}</td><td>${esc(index.kind)}</td><td>${esc(indexProperties(index))}</td><td>${esc(index.source)}</td><td>${esc(index.state)}</td><td>${progress}</td><td>${esc(index.error || "")}</td></tr>`;
              })
              .join("")
          : '<tr><td colspan="7" class="muted">none</td></tr>';

        document.querySelectorAll("[data-index-sort]").forEach((button) => {
          const isActive = button.dataset.indexSort === indexSortKey;
          button.parentElement.setAttribute(
            "aria-sort",
            isActive
              ? indexSortDirection === "asc"
                ? "ascending"
                : "descending"
              : "none",
          );
          button.textContent =
            button.dataset.indexSort +
            (isActive ? ` ${indexSortDirection}` : "");
        });
      }

      const DETAIL_KEY_ORDER = [
        "kind",
        "kinds",
        "namespace",
        "database",
        "keys",
        "paths",
        "mutations",
        "inserts",
        "updates",
        "upserts",
        "deletes",
        "mode",
        "aggregations",
        "aggregation_count",
        "filter",
        "order_by",
        "limit",
        "offset",
        "start_cursor",
        "keys_only",
        "projection",
        "distinct_on",
        "transforms",
        "transform_ops",
        "property_masks",
        "property_mask",
        "read_time_at",
        "request_txn",
        "new_transaction",
        "txn_id_prefix",
        "previous_transaction",
        "analyze",
        "gql",
        "parent_paths",
        "transaction",
        "collection",
        "parent",
        "group",
        "page_size",
        "doc",
        "docs",
        "mask",
        "sets",
        "merges",
        "xforms",
        "writes",
        "collections",
        "found",
        "missing",
        "deferred",
        "results",
        "skipped_results",
        "more_results",
        "end_cursor",
        "conflicts",
        "allocated_keys",
        "allocated_paths",
        "allocated",
        "allocated_ids",
        "txn_returned",
        "read_time",
        "commit_time",
        "elapsed_ms",
        "write_results",
        "successes",
        "failures",
        "field_count",
        "update_time",
        "create_time",
        "access_path",
        "index_id",
        "index_entries_scanned",
        "scanned",
        "execution_duration_ms",
        "name",
      ];

      const RESPONSE_KEYS = new Set([
        "found",
        "missing",
        "deferred",
        "results",
        "skipped_results",
        "more_results",
        "end_cursor",
        "conflicts",
        "allocated_keys",
        "allocated_paths",
        "allocated",
        "allocated_ids",
        "txn_returned",
        "read_time",
        "commit_time",
        "elapsed_ms",
        "write_results",
        "successes",
        "failures",
        "field_count",
        "update_time",
        "create_time",
        "access_path",
        "index_id",
        "index_entries_scanned",
        "scanned",
        "execution_duration_ms",
        "name",
        "docs",
      ]);

      function isResponseKey(key) {
        return RESPONSE_KEYS.has(key) || key.startsWith("agg_");
      }

      function valSpan(value) {
        if (value == null) return '<span class="val-null">null</span>';
        if (typeof value === "boolean")
          return `<span class="val-bool">${value}</span>`;
        if (typeof value === "number")
          return `<span class="val-num">${value}</span>`;
        if (Array.isArray(value)) {
          const full = value.join(", ");
          const omitted = value.at(-1);
          const hasOmittedCount =
            typeof omitted === "string" && /^\+\d+ more$/.test(omitted);
          const display = hasOmittedCount
            ? value.slice(0, -1).join(", ") + ", " + omitted
            : value.length > 5
              ? value.slice(0, 5).join(", ") +
                " ... +" +
                (value.length - 5) +
                " more"
              : full;
          return `<span class="val-arr" title="${esc(full)}">${esc(display)}</span>`;
        }
        const stringValue = String(value);
        const display =
          stringValue.length > 160
            ? stringValue.slice(0, 157) + "..."
            : stringValue;
        return `<span class="val-str" title="${esc(stringValue)}">${esc(display)}</span>`;
      }

      function renderKV(entries) {
        return (
          '<table class="metrics"><tbody>' +
          entries
            .map(
              ([key, value]) =>
                `<tr><th scope="row">${esc(key)}</th><td>${valSpan(value)}</td></tr>`,
            )
            .join("") +
          "</tbody></table>"
        );
      }

      function orderedEntries(object, filter) {
        const added = new Set();
        const entries = [];
        for (const key of DETAIL_KEY_ORDER) {
          if (key in object && (!filter || filter(key))) {
            entries.push([key, object[key]]);
            added.add(key);
          }
        }
        Object.keys(object)
          .filter((key) => !added.has(key) && (!filter || filter(key)))
          .sort()
          .forEach((key) => entries.push([key, object[key]]));
        return entries;
      }

      function panelCopy(slot, event) {
        event.stopPropagation();
        if (copySlots[slot] && navigator.clipboard) {
          navigator.clipboard.writeText(copySlots[slot]).catch(() => {});
        }
      }

      function makeSection(title, entries, slot) {
        if (!entries.length) return "";
        copySlots[slot] = JSON.stringify(Object.fromEntries(entries), null, 2);
        return `<details open class="rpc-section">
          <summary><span>${esc(title)}</span>
            <button class="rpc-copy" onclick="panelCopy('${slot}', event)" type="button">copy</button>
          </summary>
          <div class="rpc-section-body">${renderKV(entries)}</div>
        </details>`;
      }

      function makeSummarySection(entry) {
        const rows = [
          ["time", entry.t],
          ["method", entry.method || "-"],
          ["path", entry.path || "-"],
          ["latency", entry.latency_ms + " ms"],
          ["status", entry.status || "-"],
        ];
        copySlots.summary = JSON.stringify(Object.fromEntries(rows), null, 2);
        return `<details open class="rpc-section">
          <summary><span>Summary</span>
            <button class="rpc-copy" onclick="panelCopy('summary', event)" type="button">copy</button>
          </summary>
          <div class="rpc-section-body">${renderKV(rows)}</div>
        </details>`;
      }

      function openPanel(index) {
        const entry = operationEntries[index];
        if (!entry) return;
        selectedIdx = index;
        selectedOperationID = entry.id;
        document
          .querySelectorAll(".recent tbody tr")
          .forEach((row) => row.classList.remove("selected"));
        document
          .querySelector(`.recent tbody tr[data-idx="${index}"]`)
          ?.classList.add("selected");

        copySlots = {};
        const details = entry.details || {};
        const request = orderedEntries(details, (key) => !isResponseKey(key));
        const response = orderedEntries(details, isResponseKey);
        const error = entry.err
          ? `<div class="error-block">${esc(entry.err)}</div>`
          : "";
        document.getElementById("rpc-panel-body").innerHTML =
          makeSummarySection(entry) +
          makeSection("Request", request, "request") +
          makeSection("Response", response, "response") +
          error;
        document.getElementById("rpc-panel").hidden = false;
        document
          .getElementById("rpc-panel")
          .setAttribute("aria-hidden", "false");
      }

      function closePanel() {
        selectedIdx = -1;
        selectedOperationID = null;
        document.getElementById("rpc-panel").hidden = true;
        document
          .getElementById("rpc-panel")
          .setAttribute("aria-hidden", "true");
        document
          .querySelectorAll(".recent tbody tr")
          .forEach((row) => row.classList.remove("selected"));
      }

      function filterVal(id) {
        return document.getElementById(id).value.trim();
      }

      function operationParams() {
        const params = new URLSearchParams();
        const fields = [
          ["f-method", "method"],
          ["f-status", "status_class"],
          ["f-error", "error"],
          ["f-q", "q"],
          ["f-path", "path"],
          ["f-min-latency", "min_latency_ms"],
          ["f-limit", "limit"],
        ];
        for (const [id, key] of fields) {
          const value = filterVal(id);
          if (value) params.set(key, value);
        }
        params.set("order", "desc");
        return params;
      }

      function updateOperationFilterOptions(entries) {
        for (const entry of entries) {
          if (entry.method) operationMethods.add(entry.method);
        }

        const select = document.getElementById("f-method");
        const selected = select.value;
        select.length = 1;
        for (const value of [...operationMethods].sort((a, b) =>
          a.localeCompare(b),
        )) {
          select.add(new Option(value, value));
        }
        select.value = selected;
      }

      function renderOperations(result) {
        operationEntries = result.entries || [];
        updateOperationFilterOptions(operationEntries);
        document.getElementById("operations-body").innerHTML = operationEntries
          .map((entry, index) => {
            const className =
              entry.err || entry.status >= 500
                ? "err"
                : entry.status >= 400
                  ? "warn"
                  : "ok";
            const path = entry.path || "";
            const shortPath = path.length > 60 ? "..." + path.slice(-57) : path;
            return `<tr class="${className}" data-idx="${index}">
              <td class="muted">${esc(entry.t)}</td>
              <td class="muted">${esc(entry.method || "")}</td>
              <td class="path" title="${esc(path)}">${esc(shortPath)}</td>
              <td class="number">${entry.latency_ms} ms</td>
              <td class="number">${entry.status || ""}</td>
            </tr>`;
          })
          .join("");
        setText(
          "ops-count",
          `${fmt(result.matched)} matched / ${fmt(result.total)} total - session ${result.session_id || "-"}`,
        );
        if (selectedOperationID != null) {
          selectedIdx = operationEntries.findIndex(
            (entry) => entry.id === selectedOperationID,
          );
        }
        if (selectedIdx >= 0) {
          document
            .querySelector(`.recent tbody tr[data-idx="${selectedIdx}"]`)
            ?.classList.add("selected");
        } else if (selectedOperationID != null) {
          closePanel();
        }
      }

      async function refreshOperations() {
        try {
          const response = await fetch(
            "/_/operations?" + operationParams().toString(),
          );
          if (response.ok) renderOperations(await response.json());
        } catch (error) {
          console.error(error);
        }
      }

      async function pollIndexes() {
        try {
          const response = await fetch("/_/indexes");
          if (response.ok) renderIndexes(await response.json());
        } catch (error) {
          console.error(error);
        }
        setTimeout(pollIndexes, 2000);
      }

      async function pollOperations() {
        await refreshOperations();
        setTimeout(pollOperations, 2000);
      }

      document
        .getElementById("operations-body")
        .addEventListener("click", (event) => {
          const row = event.target.closest("tr[data-idx]");
          if (!row) return;
          const index = Number.parseInt(row.dataset.idx, 10);
          index === selectedIdx ? closePanel() : openPanel(index);
        });
      document.querySelectorAll("[data-index-sort]").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.indexSort;
          if (indexSortKey === key) {
            indexSortDirection = indexSortDirection === "asc" ? "desc" : "asc";
          } else {
            indexSortKey = key;
            indexSortDirection = "asc";
          }
          renderIndexes();
        });
      });
      document
        .getElementById("ops-filters")
        .addEventListener("submit", (event) => {
          event.preventDefault();
          closePanel();
          refreshOperations();
        });
      document.getElementById("ops-filters").addEventListener("reset", () => {
        setTimeout(() => {
          closePanel();
          refreshOperations();
        });
      });
      document
        .getElementById("rpc-panel-close")
        .addEventListener("click", closePanel);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closePanel();
      });

      pollIndexes();
      pollOperations();
    </script>
  </body>
</html>
